# ============================================================
# Multi-Agent Workflow 配置模板
# 复制到项目目录下重命名为 .workflow-config.yaml
# 优先级：CLI 参数 > 本配置文件 > 内置默认值
# ============================================================

# 项目路径（必填，使用 --config 时需指定）
project_dir: ~/code/your-project

# 工作区目录（可选，默认 <project_dir>/.workflow）
# workspace_dir: ./.workflow

# Flow manifest template（可选，默认使用 j-workflow 仓库内 workflow.json）
# orchestrate.sh 会基于该模板和阶段开关生成 <workspace>/<name>/workflow.json 作为本次 run workflow
# flow_file: ./workflow.json

# Agent provider（可选，默认自动推断；支持 claude 或 codex）
# provider: claude

# Agent 模型（可选，需与 provider 匹配）
# Claude Code 示例：
# model: claude-sonnet-4-6
# Codex 示例：
# provider: codex
# model: gpt-5.5
#
# 阶段模型覆盖（可选，未指定则继承 model）
# model_explore: claude-sonnet-4-6
# model_design: claude-opus-4-6
# model_review_plan: claude-opus-4-6
# model_revise: claude-opus-4-6
# model_implement: claude-sonnet-4-6
# model_review_code: claude-opus-4-6
# model_fix: claude-sonnet-4-6

# Review/Fix 循环最大轮数（可选，默认 3；CLI --max-rounds 会覆盖）
# max_rounds: 3

# ── 阶段开关 ──
# true = 启用, false = 跳过

explore: false        # 需求探索（研发主导需求时开启）
design: true          # 方案设计
review_plan: true     # 方案评审
implement: true       # TDD 实现
review_code: true     # 代码评审

# ── 断点配置 ──
# true = 该阶段后暂停等待确认, false = 自动继续

after_explore: false
after_design: true    # 方案设计后停下，审阅方案
after_review: true    # 方案评审后停下，审阅评审报告
after_implement: false
after_review_code: true
